<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Real Whiteboard Ad</title>
<style>
  @font-face { font-family: 'Marker'; src: url(fonts/PermanentMarker-Regular.ttf); }
  @font-face { font-family: 'Kalam'; font-weight: 700; src: url(fonts/Kalam-Bold.ttf); }
  :root { --ink: #1E1E22; --red: #D9262C; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; }
  .ad { position: relative; width: 540px; height: 540px; overflow: hidden; background: #D8CDB8; }
  /* painted wall with subtle texture and warm room light */
  .wall { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 25%, rgba(255,250,238,.55), transparent 60%),
      linear-gradient(180deg, #DDD3BF, #CFC3AC); }
  .grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .22; mix-blend-mode: multiply; }
  /* window on the left */
  .window { position: absolute; left: -16px; top: 10px; width: 64px; height: 360px;
    border: 7px solid #F4F1EA; border-left: none; box-shadow: 2px 3px 8px rgba(0,0,0,.25), inset 0 0 0 2px #CFC8BA; overflow: hidden; }
  .window .view { position: absolute; inset: -20px; background: url(images/garden-screen-lawn.jpg) 20% 50% / cover; filter: blur(6px) brightness(1.1) saturate(.8); }
  .window .sash { position: absolute; left: 0; right: 0; top: 48%; height: 6px; background: #F4F1EA; }
  .sill { position: absolute; left: -16px; top: 366px; width: 80px; height: 12px; background: #EEE9DF; box-shadow: 0 3px 5px rgba(0,0,0,.2); }
  /* papers pinned on the right */
  .paper { position: absolute; background: #FBFAF6; box-shadow: 1px 2px 5px rgba(0,0,0,.22);
    background-image: repeating-linear-gradient(transparent 0 9px, rgba(60,60,80,.13) 9px 10px); background-position: 0 22px; }
  .paper::before { content: ''; position: absolute; top: 5px; left: 50%; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: #C33; box-shadow: 0 1px 1px rgba(0,0,0,.4); }
  /* whiteboard */
  .boardwrap { position: absolute; left: 44px; top: 20px; width: 444px; height: 492px;
    transform: perspective(1400px) rotateY(-4deg) rotateZ(-.6deg); transform-origin: 50% 50%;
    filter: drop-shadow(6px 10px 10px rgba(0,0,0,.33)); }
  .frame { position: absolute; inset: 0; border-radius: 4px;
    background: linear-gradient(135deg, #E9EBED, #A7ACB1 30%, #DEE1E4 50%, #9CA1A6 75%, #D2D5D8); padding: 9px; }
  .board { position: relative; width: 100%; height: 100%; overflow: hidden; text-align: center; color: var(--ink);
    background:
      radial-gradient(ellipse at 18% 12%, rgba(255,255,255,.95), transparent 38%),
      radial-gradient(ellipse at 70% 60%, rgba(120,120,110,.08), transparent 55%),
      linear-gradient(170deg, #F7F7F4, #E9E9E4);
    box-shadow: inset 0 0 0 1px #BFC3C6, inset 0 2px 6px rgba(0,0,0,.15); }
  .ghost { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ink { filter: url(#marker); }
  h1 { font-family: 'Marker', cursive; font-weight: 400; line-height: .98; padding-top: 18px; opacity: .93; }
  h1 .l1 { display: block; font-size: 50px; transform: rotate(-2.5deg); letter-spacing: .5px; }
  h1 .l2 { display: block; font-size: 60px; transform: rotate(-2deg); margin-top: 2px; }
  .from { font-family: 'Kalam', cursive; font-weight: 700; font-size: 25px; letter-spacing: 2.5px; color: var(--red); margin-top: 8px; transform: rotate(-1deg); opacity: .93; }
  .price-wrap { position: relative; display: inline-block; padding: 0 48px; margin-top: 12px; }
  .price-wrap svg { position: absolute; inset: -4px -12px; width: calc(100% + 24px); height: calc(100% + 8px); overflow: visible; }
  .price { font-family: 'Marker', cursive; font-size: 96px; line-height: 1.02; color: var(--red); opacity: .93; transform: rotate(-1.5deg); }
  .offer { font-family: 'Kalam', cursive; font-weight: 700; font-size: 22px; letter-spacing: 1.5px; color: var(--red); margin-top: 10px; opacity: .93; }
  .art { position: absolute; left: 0; right: 0; bottom: 4px; width: 100%; height: 150px; }
  /* marker tray */
  .tray { position: absolute; left: 6px; right: 6px; bottom: -14px; height: 18px; border-radius: 0 0 4px 4px;
    background: linear-gradient(#C7CBCF, #8E9398 70%, #777C81); box-shadow: 0 4px 6px rgba(0,0,0,.3); }
  .mk { position: absolute; bottom: 7px; height: 13px; width: 78px; border-radius: 3px 7px 7px 3px;
    background: linear-gradient(#FFFFFF, #E2E2E2); box-shadow: 0 2px 3px rgba(0,0,0,.45); transform: rotate(var(--r, 0deg)); }
  .mk::before { content: ''; position: absolute; left: -12px; top: 0; width: 14px; height: 13px; border-radius: 5px 1px 1px 5px; background: var(--c); }
  .mk::after { content: 'EXPO'; position: absolute; left: 20px; top: 2px; width: 40px; height: 9px; border-radius: 2px; background: var(--c);
    font: 700 6px/9px Arial, sans-serif; color: #fff; text-align: center; letter-spacing: .5px; }
  .eraser { position: absolute; bottom: 6px; left: 30px; width: 64px; height: 16px; border-radius: 3px; background: linear-gradient(#2A2A2A, #111); box-shadow: 0 2px 3px rgba(0,0,0,.4); }
  /* camera-photo finish */
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(40,30,15,.28) 100%); }
  .noise { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .09; mix-blend-mode: overlay; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <filter id="marker"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
    <filter id="grainf"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="2"/><feColorMatrix type="saturate" values="0"/></filter>
  </svg>
  <div class="ad" id="ad">
    <div class="wall"></div>
    <svg class="grain"><rect width="100%" height="100%" filter="url(#grainf)"/></svg>
    <div class="window"><div class="view"></div><div class="sash"></div></div>
    <div class="sill"></div>
    <div class="paper" style="right:-14px; top:96px; width:58px; height:150px; transform: rotate(1.5deg)"></div>
    <div class="paper" style="right:-10px; top:300px; width:52px; height:120px; transform: rotate(-1deg)"></div>

    <div class="boardwrap">
      <div class="frame">
        <div class="board">
          <!-- faint ghosting from old erased marker -->
          <svg class="ghost" viewBox="0 0 426 474" fill="none" stroke="rgba(90,90,100,.04)" stroke-width="10" stroke-linecap="round">
            <path d="M40 210 C90 190 150 230 210 200"/><path d="M260 240 C300 220 360 250 400 230"/><path d="M70 300 C120 320 170 290 220 310"/>
          </svg>
          <div class="ink">
            <h1><span class="l1">FULL BACKYARD</span><span class="l2">HARDSCAPING</span></h1>
            <div class="from">STARTING AT</div>
            <div class="price-wrap">
              <svg viewBox="0 0 300 110" preserveAspectRatio="none" fill="none" stroke="#D9262C" stroke-width="3.2" stroke-linecap="round" opacity=".93">
                <path d="M150 5 C252 3 298 30 296 57 C294 90 230 108 150 106 C68 104 4 90 4 57 C4 25 62 6 168 9"/>
              </svg>
              <div class="price">$9,997</div>
            </div>
            <div class="offer">(LIMITED TIME OFFER)</div>
          </div>

          <svg class="art" viewBox="0 0 426 150" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".93">
            <g filter="url(#rough)">
              <!-- shrubs behind wall -->
              <g stroke="#2E7D32" fill="#CFE6C8" stroke-width="1.8">
                <path d="M8 60 C2 44 16 32 28 40 C34 26 54 30 52 44 C62 40 70 52 62 60 Z"/>
                <path d="M56 58 C52 44 66 36 76 44 C84 32 102 38 98 50 C108 50 110 60 104 62 Z"/>
                <path d="M104 72 C100 60 112 54 120 60 C126 50 140 54 138 64 C146 64 148 72 142 74 Z"/>
              </g>
              <!-- tiered stone retaining wall -->
              <path d="M4 108 V62 H104 V74 H150 V108 Z" fill="#E9DFCB"/>
              <g stroke-width="1.3">
                <path d="M4 76 H104"/><path d="M4 92 H150"/><path d="M104 74 V108"/>
                <path d="M30 62 V76"/><path d="M60 62 V76"/><path d="M84 62 V76"/>
                <path d="M18 76 V92"/><path d="M46 76 V92"/><path d="M76 76 V92"/><path d="M126 74 V92"/>
                <path d="M32 92 V108"/><path d="M64 92 V108"/><path d="M96 92 V108"/><path d="M130 92 V108"/>
              </g>
              <g stroke="none"><rect x="31" y="63" width="28" height="12" fill="#C9C3B8"/><rect x="47" y="77" width="28" height="14" fill="#D9B98C"/><rect x="65" y="93" width="30" height="14" fill="#C9C3B8"/><rect x="5" y="93" width="26" height="14" fill="#D9B98C"/><rect x="105" y="75" width="20" height="16" fill="#D9B98C"/></g>
              <!-- steps -->
              <path d="M150 108 V96 H164 V108"/><path d="M164 108 V102 H176"/>
              <!-- paving in perspective -->
              <path d="M0 148 L18 108 H410 L426 148 Z" fill="#EEEBE5"/>
              <g stroke-width="1.1" stroke="#555">
                <path d="M10 128 H418"/><path d="M60 108 L50 148"/><path d="M110 108 L104 148"/><path d="M160 108 L158 148"/><path d="M210 108 L212 148"/><path d="M260 108 L266 148"/><path d="M310 108 L320 148"/><path d="M360 108 L374 148"/>
                <path d="M85 128 L82 148"/><path d="M185 108 L184 128"/><path d="M285 128 L290 148"/><path d="M335 108 L340 128"/>
              </g>
              <!-- stick figure in a cap laying pavers -->
              <g stroke-width="2.4">
                <circle cx="196" cy="76" r="9" fill="#fff"/>
                <path d="M187 73 Q196 62 205 73"/><path d="M203 72 L214 74"/>
                <path d="M192 76 h.1"/><path d="M199 76 h.1"/><path d="M193 80 Q196 82 199 80" stroke-width="1.5"/>
                <path d="M194 85 L182 108"/>
                <path d="M182 108 L198 116 L196 128"/><path d="M182 108 L168 118 L176 128"/>
                <path d="M192 92 L210 110"/><path d="M190 96 L206 116"/>
              </g>
              <path d="M206 110 L228 108 L230 118 L208 120 Z" fill="#B9B4AA"/>
              <path d="M226 126 L250 124 L252 134 L228 136 Z" fill="#B9B4AA"/><path d="M246 116 L268 114 L270 124 L248 126 Z" fill="#B9B4AA"/><path d="M256 134 L280 132 L282 142 L258 144 Z" fill="#B9B4AA"/>
              <!-- pergola with string lights -->
              <g stroke="#7A4E25" stroke-width="2.6" fill="#D8B48A">
                <path d="M306 116 V40"/><path d="M396 112 V36"/><path d="M330 104 V48"/><path d="M412 102 V44"/>
                <path d="M296 40 L420 32 L424 38 L298 46 Z"/>
              </g>
              <g stroke="#7A4E25" stroke-width="1.5"><path d="M312 30 V48"/><path d="M332 28 V46"/><path d="M352 27 V45"/><path d="M372 26 V44"/><path d="M392 25 V43"/><path d="M410 24 V40"/></g>
              <path d="M306 54 Q330 64 352 54 T398 52" stroke-width="1.2"/>
              <g stroke="#B8860B" fill="#FFD54A" stroke-width="1"><circle cx="316" cy="59" r="2.6"/><circle cx="330" cy="62" r="2.6"/><circle cx="344" cy="59" r="2.6"/><circle cx="360" cy="56" r="2.6"/><circle cx="376" cy="58" r="2.6"/><circle cx="390" cy="55" r="2.6"/></g>
              <!-- table and chairs -->
              <path d="M338 92 H384" stroke-width="2.4"/><path d="M344 92 V112"/><path d="M378 92 V112"/>
              <path d="M326 84 V112"/><path d="M326 98 H336 V112"/>
              <path d="M396 84 V112"/><path d="M396 98 H386 V112"/>
              <!-- potted plant -->
              <path d="M406 120 H422 L419 138 H409 Z" fill="#D9D3C8"/>
              <g stroke="#2E7D32" stroke-width="1.8"><path d="M414 120 C410 110 404 106 398 104"/><path d="M414 120 C416 108 420 102 424 98"/><path d="M414 120 C414 110 412 104 412 98"/></g>
              <!-- shrubs right -->
              <g stroke="#2E7D32" fill="#CFE6C8" stroke-width="1.8"><path d="M270 56 C266 44 278 36 288 42 C294 32 310 36 308 48 C316 48 318 56 312 58 Z"/></g>
            </g>
          </svg>
        </div>
        <div class="tray">
          <span class="eraser"></span>
          <span class="mk" style="--c:#1C1C1C; left:120px; --r:-2deg"></span>
          <span class="mk" style="--c:#C8202A; left:250px; --r:1deg"></span>
          <span class="mk" style="--c:#1E7B34; left:340px; --r:-1deg"></span>
        </div>
      </div>
    </div>

    <div class="vignette"></div>
    <svg class="noise"><rect width="100%" height="100%" filter="url(#grainf)"/></svg>
  </div>
</body>
</html>
