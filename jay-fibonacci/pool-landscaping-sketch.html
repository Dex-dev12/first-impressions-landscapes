  .l2 { top: 66px; font-size: 60px; color: var(--green); transform: rotate(-2.5deg); letter-spacing: 1px; }
  .art { position: absolute; left: 0; top: 140px; width: 540px; height: 285px; }
  .deco { position: absolute; inset: 0; width: 100%; height: 100%; }
  .from {
    position: absolute; left: 150px; top: 362px; padding: 2px 16px; font-size: 34px; color: var(--ink);
    transform: rotate(-2deg); filter: url(#pencil);
  }
  .from::before { content: ''; position: absolute; inset: 4px -4px 2px -6px; background: var(--yellow); z-index: -1; transform: skewX(-8deg); border-radius: 3px; filter: url(#hl); }
  .price { position: absolute; left: 116px; top: 398px; font-size: 98px; line-height: 1; color: var(--red); transform: rotate(-2deg); filter: url(#pencil); letter-spacing: 1px; }

</style>
