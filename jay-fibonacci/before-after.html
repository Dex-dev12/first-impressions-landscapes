<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Before and After Ad</title>
<style>
  @font-face { font-family: 'Oswald'; font-weight: 500; src: url(fonts/Oswald-Medium.ttf); }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url(fonts/Montserrat-ExtraBold.ttf); }
  :root { --navy: #0B1524; --navy2: #13223B; --gold: #CC9A3C; --gold2: #E2BC70; --cream: #F5F1E6; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; }
  .ad {
    position: relative; width: 540px; height: 675px; padding: 22px 22px 0;
    background: radial-gradient(ellipse at 50% 0%, var(--navy2), var(--navy) 70%);
    color: var(--cream); text-align: center; font-family: 'Montserrat', sans-serif;
  }
  h1 { font-family: 'Oswald', sans-serif; font-weight: 500; text-transform: uppercase; line-height: 1.02; }
  h1 .s { display: block; font-size: 30px; letter-spacing: 3px; }
  h1 .b { display: block; font-size: 44px; color: var(--gold2); letter-spacing: .5px; }
  .pair { position: relative; margin-top: 16px; display: grid; gap: 10px; }
  .shot { position: relative; height: 218px; border: 3px solid var(--gold); background-size: cover; background-position: center; }
  .tag {
    position: absolute; top: 12px; left: 12px; padding: 5px 14px; border-radius: 4px;
    font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 20px; letter-spacing: 3px; text-transform: uppercase;
  }
  .tag.before { background: rgba(11,21,36,.88); color: var(--cream); border: 1px solid rgba(245,241,230,.5); }
  .tag.after { background: var(--gold); color: var(--navy); }
  .arrow {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    border-radius: 50%; background: var(--gold); border: 4px solid var(--navy);
    display: grid; place-items: center; z-index: 2;
  }
  .arrow svg { width: 28px; height: 28px; }
  .sub { margin-top: 16px; font-size: 19px; letter-spacing: .2px; }
  .brand {
    position: absolute; left: 0; right: 0; bottom: 16px;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 17px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold2);
  }
  .brand img { width: 28px; height: 28px; }
</style>
</head>
<body>
  <div class="ad" id="ad">
    <h1><span class="s">Planning a</span><span class="b">Landscaping Project?</span></h1>
    <div class="pair">
      <div class="shot" style="background-image:url(images/service-fencing.jpg); background-position: 50% 62%"><span class="tag before">Before</span></div>
      <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#0B1524" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M5 12l7 7 7-7"/></svg></div>
      <div class="shot" style="background-image:url(images/hero-2.jpg); background-position: 50% 45%"><span class="tag after">After</span></div>
    </div>
    <div class="sub">Enquire about your upcoming project.</div>
    <div class="brand"><img src="images/logo-mark.png" alt="">Fibonacci Landscapes</div>
  </div>
</body>
</html>
